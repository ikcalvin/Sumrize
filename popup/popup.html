<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumrize</title>
  <link rel="stylesheet" href="popup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#grad)" opacity="0.15"/>
          <path d="M9 9h6M9 12h6M9 15h4" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="2" y1="2" x2="22" y2="22">
              <stop stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Sumrize</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner hidden">
      <div class="status-dot"></div>
      <span id="statusText"></span>
    </div>

    <!-- Key Missing Warning -->
    <div id="keyWarning" class="key-warning hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>API keys missing. <a id="openSettings" href="#">Set up keys →</a></span>
    </div>

    <!-- Voice Selector -->
    <div class="control-group">
      <label class="control-label">Voice</label>
      <div class="select-wrapper">
        <select id="voiceSelect" class="voice-select">
          <optgroup label="Female Voices">
            <option value="aura-2-thalia-en">Thalia — American</option>
            <option value="aura-2-andromeda-en">Andromeda — American</option>
            <option value="aura-2-athena-en">Athena — British</option>
            <option value="aura-2-luna-en">Luna — American</option>
            <option value="aura-2-stella-en">Stella — American</option>
          </optgroup>
          <optgroup label="Male Voices">
            <option value="aura-2-arcas-en">Arcas — American</option>
            <option value="aura-2-helios-en">Helios — American</option>
            <option value="aura-2-orpheus-en">Orpheus — American</option>
            <option value="aura-2-perseus-en">Perseus — American</option>
            <option value="aura-2-zeus-en">Zeus — American</option>
          </optgroup>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="summarizeBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Summarize</span>
      </button>
      <button id="listenBtn" class="btn btn-secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Listen</span>
      </button>
    </div>

    <!-- Summary Display -->
    <div id="summaryContainer" class="summary-container hidden">
      <div class="summary-header">
        <h3 id="articleTitle" class="article-title"></h3>
        <button id="copySummary" class="icon-btn small" title="Copy summary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </button>
      </div>
      <div id="summaryText" class="summary-text"></div>
    </div>

    <!-- Audio Player -->
    <div id="playerContainer" class="player-container hidden">
      <div class="player-progress-wrapper">
        <div class="player-progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="player-times">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <button id="playPauseBtn" class="play-pause-btn" title="Play/Pause">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <div class="speed-control">
          <label class="speed-label">Speed</label>
          <select id="speedSelect" class="speed-select">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
