<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumrize — Settings</title>
  <link rel="stylesheet" href="options.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#grad2)" opacity="0.15"/>
          <path d="M9 9h6M9 12h6M9 15h4" stroke="url(#grad2)" stroke-width="1.8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad2" x1="2" y1="2" x2="22" y2="22">
              <stop stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Sumrize</span>
      </div>
      <span class="subtitle">Settings</span>
    </header>

    <div class="card">
      <div class="field">
        <label for="llmProvider" class="field-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          AI Summarization Provider
        </label>
        <p class="field-desc">Choose the AI model you want to use for summarization.</p>
        <select id="llmProvider" class="input" style="padding: 10px; border-radius: 8px;">
          <option value="groq">Groq</option>
          <option value="openai">ChatGPT (OpenAI)</option>
          <option value="anthropic">Claude (Anthropic)</option>
          <option value="deepseek">DeepSeek</option>
          <option value="gemini">Google Gemini</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </div>

      <div class="field" style="margin-top: 16px;">
        <label for="llmKey" class="field-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          API Key
        </label>
        <p class="field-desc" id="llmKeyDesc">Enter your API key.</p>
        <div class="input-wrapper">
          <input type="password" id="llmKey" class="input" placeholder="Enter API Key..." autocomplete="off" />
          <button class="toggle-vis" data-target="llmKey" title="Toggle visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field" style="margin-top: 16px;">
        <label for="llmModel" class="field-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          Model ID
        </label>
        <p class="field-desc">The specific model to use (leave blank for default).</p>
        <input type="text" id="llmModel" class="input" placeholder="e.g. llama-3.3-70b-versatile" autocomplete="off" />
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="unrealSpeechKey" class="field-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Unreal Speech API Key
        </label>
        <p class="field-desc">Get your key at <a href="https://unrealspeech.com" target="_blank" rel="noopener">unrealspeech.com</a></p>
        <div class="input-wrapper">
          <input type="password" id="unrealSpeechKey" class="input" placeholder="Enter your Unreal Speech API key..." autocomplete="off" />
          <button class="toggle-vis" data-target="unrealSpeechKey" title="Toggle visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field" style="margin-top: 16px;">
        <label for="voiceSelect" class="field-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          Voice Selection
        </label>
        <p class="field-desc">Choose the TTS voice used for audio playback.</p>
        <select id="voiceSelect" class="input" style="padding: 10px; border-radius: 8px;">
          <optgroup label="Female">
            <option value="Autumn">Autumn</option>
            <option value="Melody">Melody</option>
            <option value="Hannah">Hannah</option>
            <option value="Emily">Emily</option>
            <option value="Ivy">Ivy</option>
          </optgroup>
          <optgroup label="Male">
            <option value="Noah">Noah</option>
            <option value="Jasper">Jasper</option>
            <option value="Caleb">Caleb</option>
            <option value="Ronan">Ronan</option>
            <option value="Ethan">Ethan</option>
            <option value="Daniel">Daniel</option>
            <option value="Zane">Zane</option>
          </optgroup>
        </select>
      </div>
    </div>

    <button id="saveBtn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save Settings
    </button>

    <div id="successMsg" class="success-msg hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Settings saved successfully!
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
